<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Platformer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d2b53;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      /* Keep the low-res art crisp when the canvas is scaled up. */
      canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
